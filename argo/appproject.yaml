apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: askvault
  namespace: argocd
spec:
  description: AskVault app namespaces only (L5)
  # This URL must match the URL the repository is REGISTERED under, character for
  # character. Argo matches sourceRepos by string, not by "same repo, different
  # transport" -- registering the repo as git@github.com:... while this line says
  # https://github.com/... produces a project that permits nothing, and the
  # Application then refuses to sync with a message about the project rather than
  # about the URL. Both are the SSH form, because the credential the cluster
  # holds is a read-only deploy key and not a token.
  sourceRepos:
    - git@github.com:benzac708/askvault-gitops.git
  destinations:
    - namespace: askvault-dev
      server: https://kubernetes.default.svc
    - namespace: askvault-prod
      server: https://kubernetes.default.svc
  # L5, stated precisely. `clusterResourceWhitelist` is NOT empty, and the
  # reason is mechanical rather than a weakening of intent: `Namespace` is a
  # cluster-scoped kind, so `syncOptions: CreateNamespace=true` cannot work
  # without it, and it is not covered by `namespaceResourceWhitelist` (which
  # only ever applies to namespaced kinds). The first attempt at this field was
  # `clusterResourceWhitelist: []` and the observable symptom was an auto-sync
  # that retried forever with:
  #     resource :Namespace is not permitted in project askvault
  #
  # So the whitelist names exactly one kind. What matters for L5 is what is
  # still absent: ClusterRole, ClusterRoleBinding, CRD, ValidatingWebhookConfig,
  # and every other escalation primitive remain forbidden. Creating a Namespace
  # grants no permission over anything inside it, so the property the project
  # exists to hold -- "a compromised app repo cannot escalate itself" -- is
  # intact. An empty list was the stricter-looking and functionally broken
  # version of the same policy.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  # FINDING 20 is the honest cost of the line above: this project cannot write
  # to `monitoring` or `ingress-controller`, so the Traefik PodMonitor had to be
  # created out of band by hand. Scoping is still right, but part of the
  # observability story does not live in Git, and pretending otherwise would be
  # the actual defect.
