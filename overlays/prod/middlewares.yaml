# Prod routing policy: security headers, a coarse edge rate cap, and retries
# on the read path only. The app's own fine-grained limits (10/min per IP,
# 15/min and 40/day global) remain the real quota control; this middleware
# stack is defense in depth, applied at Traefik rather than in the app.

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: askvault-headers
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: "no-referrer"
    browserXssFilter: true

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: askvault-ratelimit
spec:
  rateLimit:
    average: 2
    burst: 10
    sourceCriterion:
      # cloudflared is the single peer address, so the real client IP lives
      # one hop deep in X-Forwarded-For. depth: 1 reads it instead of
      # rate-limiting every visitor as one host.
      ipStrategy:
        depth: 1

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: askvault-retry
spec:
  retry:
    attempts: 2