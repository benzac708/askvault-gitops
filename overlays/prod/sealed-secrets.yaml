# Secrets as code: bitnami Sealed Secrets (controller in kube-system).
# The controller decrypts these into plain Secrets in the target
# namespaces, so a full rebuild needs no interactive credential prompt.
# Re-seal with: kubeseal --format yaml --scope strict --namespace <ns> --name <name>
# Plaintext never enters this repository.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: askvault-llm
  namespace: askvault-prod
spec:
  encryptedData:
    api-key: 
  template:
    metadata:
      creationTimestamp: null
      name: askvault-llm
      namespace: askvault-prod
    type: Opaque
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: ghcr-pull
  namespace: askvault-prod
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      creationTimestamp: null
      name: ghcr-pull
      namespace: askvault-prod
    type: kubernetes.io/dockerconfigjson
