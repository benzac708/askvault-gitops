# The only prod-specific change in the overlay: the public hostname.
#
# The rule is repeated in full rather than patched as `- host: ...` alone. A
# host-only patch does not work here and silently produces a broken Ingress:
# spec.rules merges on the `host` key, so a patch whose host differs from the
# sentinel does not merge into the base rule, it replaces it, and the `http:`
# block with both paths is dropped. The render then has a host and zero paths,
# which still passes `kubectl kustomize` and still passes validation -- and
# routes nothing. Verified by rendering, not by reading.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: askvault
spec:
  rules:
    - host: askvault.zachara.dev
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: askvault
                port:
                  name: http
          - path: /chat
            pathType: Exact
            backend:
              service:
                name: askvault
                port:
                  name: http
