apiVersion: v1
kind: Service
metadata:
  name: askvault
  labels:
    app.kubernetes.io/name: askvault
    app.kubernetes.io/component: rag-service
    app.kubernetes.io/part-of: askvault
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: askvault
    app.kubernetes.io/component: rag-service
  ports:
    - name: http
      # Named port so the probes and the Ingress reference `http` rather than a
      # number that has to be changed in three places if the container moves.
      port: 8000
      targetPort: http
      protocol: TCP
