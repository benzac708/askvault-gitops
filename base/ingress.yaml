apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: askvault
  labels:
    app.kubernetes.io/name: askvault
    app.kubernetes.io/component: rag-service
    app.kubernetes.io/part-of: askvault
spec:
  ingressClassName: traefik
  # L2: exactly two paths, both Exact. `/` serves the web UI and accepts its form
  # POST; `/chat` is the JSON endpoint. Nothing else is routed, which is the
  # security property rather than an omission -- /healthz, /readyz and /metrics
  # are deliberately unreachable from outside the cluster and are reached
  # in-cluster by kubelet and Prometheus instead. A Prefix or ImplementationSpecific
  # path type on `/` would silently expose all three.
  #
  # No `tls:` block. cloudflared terminates TLS in its own edge and forwards plain
  # HTTP to the Traefik NodePort on 30080, so a cert here would be a second,
  # unused certificate (D36).
  #
  # The host here is a sentinel, not a hostname. `.invalid` is reserved by RFC 2606
  # and can never resolve, so a bare `kubectl apply -k base` can never accidentally
  # claim a real public name. Each overlay sets its own host.
  rules:
    - host: askvault.invalid
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: askvault
                port:
                  name: http
          - path: /chat
            pathType: Exact
            backend:
              service:
                name: askvault
                port:
                  name: http
